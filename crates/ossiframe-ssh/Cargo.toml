[package]
name = "ossiframe-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
ossiframe-core = { version = "0.1.0", path = "../ossiframe-core" }
russh = "0.65.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "net"] }
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
