[package]
name = "ossiframe-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
keyring-core = "1.1.0"
ossiframe-core = { version = "0.1.0", path = "../ossiframe-core" }
ossiframe-ssh = { version = "0.1.0", path = "../ossiframe-ssh" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1.29.3", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
