[package]
name = "ossiframe-mod-ubuntu-provisioning"
description = "Ossiframe module: provisioning of a base stack on Ubuntu servers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
ossiframe-core = { version = "0.1.0", path = "../../crates/ossiframe-core" }
ossiframe-mod-linux-inventory = { version = "0.1.0", path = "../linux-inventory" }
serde_json = "1.0.154"

[dev-dependencies]
ossiframe-ssh = { version = "0.1.0", path = "../../crates/ossiframe-ssh" }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
