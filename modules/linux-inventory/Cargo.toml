[package]
name = "ossiframe-mod-linux-inventory"
description = "Ossiframe module: read-only Linux server inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
ossiframe-core = { version = "0.1.0", path = "../../crates/ossiframe-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
