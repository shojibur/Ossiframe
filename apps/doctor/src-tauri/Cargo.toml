[package]
name = "ossiframe-doctor"
description = "Ossiframe Doctor: read-only server discovery and diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ossiframe_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ossiframe-core = { version = "0.1.0", path = "../../../crates/ossiframe-core" }
ossiframe-desktop = { version = "0.1.0", path = "../../../crates/ossiframe-desktop", features = ["tauri"] }
ossiframe-mod-linux-inventory = { version = "0.1.0", path = "../../../modules/linux-inventory" }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1.0.154"
