[package]
name = "ossiframe-deploy"
description = "Ossiframe Deploy: server provisioning and application deployment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ossiframe_deploy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
ossiframe-core = { version = "0.1.0", path = "../../../crates/ossiframe-core" }
ossiframe-desktop = { version = "0.1.0", path = "../../../crates/ossiframe-desktop", features = ["tauri", "provisioning"] }
ossiframe-mod-app-deploy = { version = "0.1.0", path = "../../../modules/app-deploy" }
ossiframe-mod-linux-inventory = { version = "0.1.0", path = "../../../modules/linux-inventory" }
ossiframe-mod-ubuntu-provisioning = { version = "0.1.0", path = "../../../modules/ubuntu-provisioning" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
